[package]
name = "celframe-desktop"
description = "Celframe desktop app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "celframe_desktop"
crate-type = ["lib", "staticlib", "cdylib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
celframe-core = { path = "../../../crates/celframe-core" }
celframe-format = { path = "../../../crates/celframe-format" }
celframe-render = { path = "../../../crates/celframe-render" }
pollster = "1.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = ["macos-private-api"] }
tauri-plugin-dialog = "2.8.4"
wgpu = "30.0.1"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
