name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # The one check branch protection requires, so the job list can change freely.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [rust]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.rust.result }}" = "success"
