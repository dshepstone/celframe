name: Bug report
description: Something isn't working
labels: ["type:bug"]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected and what happened
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, GPU and Celframe version
    validations:
      required: true
