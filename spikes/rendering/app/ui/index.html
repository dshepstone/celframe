<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Celframe rendering spike</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        font: 13px system-ui;
        background: transparent;
        overflow: hidden;
      }
      #surface {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #panel {
        position: fixed;
        top: 12px;
        left: 12px;
        width: 340px;
        padding: 10px;
        background: #1f1c17;
        color: #fff;
        border-radius: 8px;
        white-space: pre-wrap;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="surface"></canvas>
    <div id="panel">Starting…</div>
    <script type="module" src="spike.js"></script>
  </body>
