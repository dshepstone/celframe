[package]
name = "spike-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spike-renderer = { path = "../renderer" }
tauri = { version = "2.12.5", features = ["macos-private-api"] }
wgpu = "30.0.1"
