<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80">
  <g transform="translate(4 8)" fill="none" stroke-width="6.5">
  <!-- The back frame, hidden where the front frame covers it. -->
  <mask id="logo-behind">
    <rect width="64" height="64" fill="#fff"/>
    <rect x="5.5" y="17.5" width="40" height="40" rx="8" fill="#000"/>
  </mask>
  <rect x="17.5" y="5.5" width="40" height="40" rx="8" stroke="#e38a9c" mask="url(#logo-behind)"/>
  <!-- The front frame, open on its right side where the back frame passes behind. -->
  <path d="M45.5 41.5V49.5A8 8 0 0 1 37.5 57.5H13.5A8 8 0 0 1 5.5 49.5V25.5A8 8 0 0 1 13.5 17.5H37.5A8 8 0 0 1 45.5 25.5V30" stroke="#f24b36"/>
</g>
  <text x="80" y="60" fill="#111113" font-family="'Segoe UI Variable Display', 'Segoe UI', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="56" font-weight="800" letter-spacing="-1.5">celframe</text>
</svg>
