[package]
name = "celframe-format"
description = "Celframe: .celf file reading and writing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
celframe-core = { version = "0.0.0", path = "../celframe-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
uuid = { version = "1.29.0", features = ["v7"] }
zip = { version = "9.2.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
zip = { version = "9.2.2", default-features = false, features = ["deflate"] }
